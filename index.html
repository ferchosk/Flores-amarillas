<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feli dia de la flore amarishasss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #dbe8ee;
    --ink: #17323a;
    --muted: #4b6670;
    --stem: #3d7a3c;
    --leaf: #5a9b48;
    --leaf-vein: #3d7a3c;
    --paper: #f6efe4;
    --paper-fold: #e0d2bc;
    --ribbon: #e8577e;
    --card: #fff8d6;
    --accent: #f2b705;
    --glow: #50E6E0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e2029;
      --ink: #e9f2f5;
      --muted: #93adb7;
      --stem: #5fa354;
      --leaf: #7dbb5f;
      --leaf-vein: #4f8f47;
      --paper: #e7dcc9;
      --paper-fold: #c9b99f;
      --ribbon: #ff7096;
      --card: #1d3a45;
      --accent: #ffd83a;
      --glow: #50E6E0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e2029;
    --ink: #e9f2f5;
    --muted: #93adb7;
    --stem: #5fa354;
    --leaf: #7dbb5f;
    --leaf-vein: #4f8f47;
    --paper: #e7dcc9;
    --paper-fold: #c9b99f;
    --ribbon: #ff7096;
      --card: #1d3a45;
      --accent: #ffd83a;
      --glow: #50E6E0;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    background: linear-gradient(90deg,
      #C9E444 0 20%, #E4DC0A 20% 40%, #50E6E0 40% 60%, #D6D429 60% 80%, #CDBE21 80% 100%);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* Collage de fondo con imágenes al azar */
  #collage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }
  #collage img {
    position: absolute;
    display: block;
    object-fit: cover;
    object-position: 50% 35%;
    border: 0;
    border-radius: 0;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
    animation: caer .55s cubic-bezier(.2,1.2,.4,1) both;
  }
  @keyframes caer { from { opacity: 0; scale: .55; } to { opacity: 1; scale: 1; } }

  main {
    position: relative;
    z-index: 1;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    justify-items: center;
    padding: 22px 20px 20px;
    gap: 10px;
  }

  h1 {
    margin: 0;
    max-width: 22ch;
    font-family: "Young Serif", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(1.5rem, 5vw, 2.4rem);
    line-height: 1.2;
    text-align: center;
    padding: 10px 22px 12px;
    border-radius: 22px;
    background: var(--card);
    border: 2px solid var(--accent);
    box-shadow: 0 5px 0 var(--accent), 0 14px 28px rgba(0, 0, 0, .18);
    transform: rotate(-1.2deg);
  }

  /* Todo el ramo es el botón: cada toque agrega un pétalo */
  .stage {
    width: 100%;
    min-height: 0;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    display: flex;
    justify-content: center;
    align-items: stretch;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .stage:focus-visible { outline: 3px solid #f2b705; outline-offset: 4px; border-radius: 12px; }
  svg {
    height: 100%;
    max-width: 100%;
    width: auto;
    aspect-ratio: 400 / 600;
    overflow: visible;
    pointer-events: none;
  }

  .foot { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #bar {
    width: min(260px, 70vw);
    height: 12px;
    border-radius: 999px;
    background: var(--card);
    border: 2px solid var(--accent);
    overflow: hidden;
  }
  #fill { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }

  #caption {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
    min-height: 2rem;
    text-align: center;
    padding: 7px 18px;
    border-radius: 999px;
    background: var(--card);
    border: 2px solid var(--accent);
  }
  #caption.done {
    color: #2a1f00;
    background: var(--accent);
    box-shadow: 0 5px 0 rgba(0, 0, 0, .18);
    font-family: "Young Serif", Georgia, "Times New Roman", serif;
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    line-height: 1.2;
    animation: aparecer .7s ease-out both;
  }

  .stem { fill: none; stroke: var(--stem); stroke-width: 5; stroke-linecap: round;
          stroke-dasharray: 1; stroke-dashoffset: 1;
          animation: grow 1s cubic-bezier(.3,.7,.3,1) forwards; }
  .leaf { fill: var(--leaf); }
  .vein { fill: none; stroke: var(--leaf-vein); stroke-width: 1.6; stroke-linecap: round; }
  .paper { fill: var(--paper); }
  .fold { fill: none; stroke: var(--paper-fold); stroke-width: 2; stroke-linecap: round; }
  .ribbon { fill: var(--ribbon); }

  .pop { transform-box: fill-box; animation: pop .6s cubic-bezier(.2,1.3,.4,1) both; }
  .petal { transform-origin: 50% 100%; animation-duration: .5s; }
  .leaf-wrap { transform-origin: 0% 50%; }
  .disc { transform-origin: 50% 50%; }

  @keyframes grow { to { stroke-dashoffset: 0; } }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    #collage img { animation: none; }
    #fill { transition: none; }
    .stem { animation: none; stroke-dashoffset: 0; }
    .pop, #caption.done { animation: none; }
  }
</style>
</head>
<body>
<div id="collage" aria-hidden="true"></div>
<main>
  <h1>feli dia de la flore amarishasss</h1>

  <button class="stage" id="stage" type="button" aria-label="Agregar un pétalo al ramo">
    <svg id="ramo" viewBox="0 0 400 600" role="img" aria-label="Un ramo de flores amarillas al que le van saliendo pétalos"></svg>
  </button>

  <div class="foot">
    <p id="caption" aria-live="polite"></p>
    <div id="bar" aria-hidden="true"><span id="fill"></span></div>
  </div>
</main>

        img.style.top    = "calc(" + (y0 / rows * 100) + "% + " + (GAP / 2) + "px)";
        img.style.width  = "calc(" + (f[0] / cols * 100) + "% - " + GAP + "px)";
        img.style.height = "calc(" + (f[1] / rows * 100) + "% - " + GAP + "px)";
        if (animar) img.style.animationDelay = (n * 0.05).toFixed(2) + "s";
        else img.style.animation = "none";
        box.appendChild(img);
        n++;
      }
    }
  }

  armar(true);

  var t;
  window.addEventListener("resize", function () {
    clearTimeout(t);
    t = setTimeout(function () {
      var m = medidas();
      if (m.cols !== lastCols || m.rows !== lastRows) armar(false);
    }, 200);
  });
})();
</script>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("ramo");
  var stage = document.getElementById("stage");
  var caption = document.getElementById("caption");

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function f(n) { return n.toFixed(2); }
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function petalPath(L, w) {
    return "M0,0 C" + f(-w) + "," + f(-L * 0.3) + " " + f(-w * 0.9) + "," + f(-L * 0.86) +
           " 0," + f(-L) + " C" + f(w * 0.9) + "," + f(-L * 0.86) + " " + f(w) + "," + f(-L * 0.3) + " 0,0Z";
  }
  var LEAF = "M0,0 C20,-26 72,-32 104,-8 C72,16 26,16 0,0Z";
  var VEIN = "M4,0 C36,-4 68,-8 96,-8";

  // Configuración del ramo
  var PETALS_EACH = 8;
  var spots = [            // x, y, escala de cada flor
    [200, 112, 1.08],
    [105, 192, 0.96],
    [295, 192, 0.96],
    [148, 284, 1.0],
    [252, 286, 1.0]
  ];
  var TOTAL = spots.length * PETALS_EACH;
  var BASE = [200, 505];   // punto donde se juntan los tallos

  // Halo turquesa detrás del ramo para que las flores amarillas resalten
  var defs = el("defs", {}, svg);
  var rg = el("radialGradient", { id: "halo" }, defs);
  el("stop", { offset: "0", "stop-color": "#50E6E0", "stop-opacity": "0.85" }, rg);
  el("stop", { offset: "0.55", "stop-color": "#50E6E0", "stop-opacity": "0.6" }, rg);
  el("stop", { offset: "1", "stop-color": "#50E6E0", "stop-opacity": "0" }, rg);
  el("ellipse", { cx: 200, cy: 310, rx: 260, ry: 330, fill: "url(#halo)" }, svg);

  // 1) Tallos
  spots.forEach(function (s, i) {
    var hx = s[0], hy = s[1];
    var d = "M" + BASE + " C" + f(200 + (hx - 200) * 0.05) + ",430 " +
            f(hx + rnd(-14, 14)) + "," + f(hy + 140) + " " + hx + "," + hy;
    el("path", { "class": "stem", pathLength: 1, d: d, style: "animation-delay:" + f(i * 0.12) + "s" }, svg);
  });

  // 2) Hojas que asoman por encima del papel
  [[190, 470, -1, -48, 0.85], [210, 470, 1, -48, 0.85],
   [176, 486, -1, -22, 0.75], [224, 486, 1, -22, 0.75]].forEach(function (l, i) {
    var g = el("g", {
      transform: "translate(" + l[0] + "," + l[1] + ") scale(" + l[2] + ",1) rotate(" + l[3] + ") scale(" + l[4] + ")"
    }, svg);
    var wrap = el("g", { "class": "leaf-wrap pop", style: "animation-delay:" + f(0.5 + i * 0.12) + "s" }, g);
    el("path", { "class": "leaf", d: LEAF }, wrap);
    el("path", { "class": "vein", d: VEIN }, wrap);
  });

  // 3) Papel de envolver, pliegues y moño
  el("path", { "class": "paper", d: "M200,594 L78,455 Q140,432 200,448 Q260,432 322,455 Z" }, svg);
  el("path", { "class": "fold", d: "M200,594 L168,446" }, svg);
  el("path", { "class": "fold", d: "M200,594 L238,446" }, svg);
  el("path", { "class": "ribbon", d: "M136,520 Q200,533 264,520 L268,537 Q200,551 132,537 Z" }, svg);
  el("ellipse", { "class": "ribbon", cx: 178, cy: 532, rx: 20, ry: 10, transform: "rotate(-18 178 532)" }, svg);
  el("ellipse", { "class": "ribbon", cx: 222, cy: 532, rx: 20, ry: 10, transform: "rotate(18 222 532)" }, svg);
  el("circle", { cx: 200, cy: 534, r: 7, fill: "var(--ribbon)", stroke: "var(--paper)", "stroke-width": 2 }, svg);

  // 4) Cabezas de las flores: capa trasera, capa delantera y centro
  var flowers = spots.map(function (s, i) {
    var hue = rnd(43, 52);
    var head = el("g", { transform: "translate(" + s[0] + "," + s[1] + ") scale(" + s[2] + ")" }, svg);
    var back = el("g", {}, head);
    var front = el("g", {}, head);
    var discR = rnd(16, 19);

    var disc = el("g", { "class": "disc pop", style: "animation-delay:" + f(0.9 + i * 0.12) + "s" }, head);
    el("circle", { r: f(discR + 3), fill: "hsl(" + f(hue - 12) + ",90%,40%)" }, disc);
    el("circle", { r: f(discR), fill: "#5a3510" }, disc);
    var golden = Math.PI * (3 - Math.sqrt(5)), seeds = Math.round(discR * 2.4);
    for (var k = 1; k <= seeds; k++) {
      var r = discR * 0.92 * Math.sqrt(k / seeds), th = k * golden;
      el("circle", {
        cx: f(r * Math.cos(th)), cy: f(r * Math.sin(th)),
        r: f(0.9 + 1.2 * (k / seeds)),
        fill: k % 3 === 0 ? "#c98a2b" : "#8a5a1c"
      }, disc);
    }
    return { hue: hue, back: back, front: front, discR: discR, L: rnd(50, 58), w: rnd(15, 19), n: 0 };
  });

  // 5) Un pétalo por clic, repartido entre todas las flores
  var count = 0;
  function agregarPetalo() {
    if (count >= TOTAL) return;
    var fl = flowers[count % flowers.length];
    var slot = (fl.n * 3) % PETALS_EACH;          // saltos de 3 para que se reparta parejo
    var ang = slot * (360 / PETALS_EACH) + rnd(-3, 3);
    var detras = slot % 2 === 1;
    var g = el("g", { transform: "rotate(" + f(ang) + ")" }, detras ? fl.back : fl.front);

    if (detras) {
      el("path", {
        "class": "petal pop", d: petalPath(fl.L * rnd(1.06, 1.16), fl.w * 1.05),
        fill: "hsl(" + f(fl.hue - 3) + ",96%,47%)"
      }, g);
    } else {
      var Lf = fl.L * rnd(0.94, 1.04);
      var pet = el("g", { "class": "petal pop" }, g);
      el("path", { d: petalPath(Lf, fl.w), fill: "hsl(" + f(fl.hue + 2) + ",100%,58%)" }, pet);
      el("path", {
        d: "M0,-" + f(fl.discR * 0.7) + " L0,-" + f(Lf * 0.82),
        stroke: "hsl(" + f(fl.hue - 4) + ",90%,44%)", "stroke-width": 1.2,
        "stroke-linecap": "round", fill: "none", opacity: 0.5
      }, pet);
    }
    fl.n++;
    count++;
    actualizarTexto();
  }

  function actualizarTexto() {
    document.getElementById("fill").style.width = (count / TOTAL * 100) + "%";
    if (count === 0) {
      caption.textContent = "Toca el ramo para que le salgan pétalos";
    } else if (count < TOTAL) {
      caption.textContent = count + " de " + TOTAL + " pétalos";
    } else {
      caption.className = "done";
      caption.textContent = "ten un lindo diaaaa de parte de ferchocho 🌼";
      stage.setAttribute("aria-label", "El ramo ya está completo");
    }
  }

  stage.addEventListener("click", agregarPetalo);
  actualizarTexto();
})();
</script>
</body>
</html>
